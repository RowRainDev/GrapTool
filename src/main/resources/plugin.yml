name: grapTool
version: '1.3'
main: dev.rowdev.grapTool.GrapTool
api-version: '1.21'
authors: [ rowrain ]
website: https://rowdev.rf.gd

commands:
  grap:
    description: Enable/disable grapple feature
    usage: /grap <on|off|reload>
    permission: graptool.admin
    permission-message: §cYou are not authorized to use this command!

permissions:
  graptool-use:
    description: Permission to use the grapple feature
    default: true
  graptool.admin:
    description: Permission to use grapple settings commands (/grap)
    default: op